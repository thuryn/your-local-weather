apply plugin: 'com.android.application'
apply plugin: 'com.github.triplet.play'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.google.devtools.ksp'

android {
    compileSdk = 37
    defaultConfig {
        applicationId = "org.thosp.yourlocalweather"
        minSdk = 23
        targetSdk = 36
        versionCode = 211
        versionName = "6.5.17"
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled = true
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.configureEach { variant ->
        outputs.all {
            outputFileName = "YourLocalWeather-${variant.name}.apk"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
            excludes += ['META-INF/*']
        }
        resources {
            excludes += ['META-INF/*']
        }
    }

    namespace 'org.thosp.yourlocalweather'
    kotlinOptions {
        jvmTarget = '17'
    }

    flavorDimensions "version"

    productFlavors {
        foss {
            dimension "version"
            versionNameSuffix "-FOSS"
        }
        play {
            dimension "version"
        }
    }

    ksp {
        arg("appfunctions:aggregateAppFunctions", "true")
    }
}

play {
    serviceAccountCredentials.set(file('../../your-local-weather-addons/keys.json'))
    track.set('production')
}

dependencies {
// AndroidX
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'com.google.android.material:material:1.14.0'
    playImplementation "com.google.android.gms:play-services-wearable:20.0.1"
    implementation "androidx.wear:wear-remote-interactions:1.2.0"
    implementation 'androidx.concurrent:concurrent-futures:1.3.0'
    implementation 'com.google.guava:guava:33.7.1-android'

// Third-party
    implementation 'com.github.yukuku:ambilwarna:2.0.1'
    implementation 'com.github.thuryn:MPAndroidChart:v4.0.4'
    //implementation files('../../../MPAndroidChart/MPChartLib/build/intermediates/compile_library_classes/debug/classes.jar')
    implementation 'org.microg:address-formatter:0.3.1'
    implementation 'com.github.hedzr:android-file-chooser:v1.2.0-final'
    implementation 'com.loopj.android:android-async-http:1.4.11'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

// Shared Resources
    implementation project(':shared-resources')
    implementation 'androidx.core:core-ktx:1.15.0'

// AppFunctions (Android 16/17 AI Agent Integration)
    implementation 'androidx.appfunctions:appfunctions:1.0.0-alpha11'
    implementation 'androidx.appfunctions:appfunctions-service:1.0.0-alpha09'
    ksp 'androidx.appfunctions:appfunctions-compiler:1.0.0-alpha11'

// Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.23.0'
}
